[project]
name = "agent-harness"
version = "0.1.0"
description = "Building an agent harness from scratch, one stage at a time."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Makes `harness/` importable from anywhere, so `uv run stages/s00_hello.py` works.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "common", "dshpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
